<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1.0">
<title>Receive USDT</title>
<style>
:root{
  --tw-blue:#002aff;
  --tw-text-dark:#000000;
  --tw-text-gray:#7e7e82;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body{
  background-color:#0c0c0d;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.phone-wrapper{
  width:100%;
  max-width:412px;
  height:890px;
  background-color:#ffffff;
  border-radius:40px;
  box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  border:8px solid #1c1c1e;
}
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  background:#ffffff;
  padding-top:20px;
}

/* ---------- HEADER ---------- */
.receive-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px;
  flex-shrink:0;
}
.back-btn{
  width:32px;
  height:32px;
  border-radius:50%;
  background:none;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--tw-text-dark);
  font-size:20px;
  cursor:pointer;
}
.header-title{
  font-size:16px;
  font-weight:700;
  color:var(--tw-text-dark);
  flex:1;
  text-align:center;
}
.header-spacer{
  width:32px;
}

/* ---------- BODY ---------- */
.receive-body{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 24px 0;
}

/* QR card */
.qr-card{
  width:280px;
  max-width:100%;
  background:#ffffff;
  border:1px solid #f0f1f3;
  border-radius:24px;
  padding:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.04);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:24px;
}
.qr-inner{
  width:100%;
  aspect-ratio:1;
  background:#f0f1f3;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.qr-inner img,
.qr-inner svg{
  width:70%;
  height:70%;
}

/* Address pill */
.address-pill{
  max-width:100%;
  background:#f4f4f7;
  border-radius:20px;
  padding:10px 18px;
  font-size:12px;
  color:#3a3a3f;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  word-break:break-all;
  text-align:center;
  cursor:pointer;
  user-select:all;
  transition:background 0.15s ease;
}
.address-pill:hover{
  background:#e9eaee;
}

/* ---------- FOOTER ---------- */
.receive-footer{
  padding:16px 20px 24px;
  flex-shrink:0;
}
.close-btn{
  width:100%;
  padding:16px;
  background:var(--tw-blue);
  color:#ffffff;
  border:none;
  border-radius:30px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:transform 0.1s ease;
}
.close-btn:active{
  transform:scale(0.98);
}
</style>
</head>
<body>
<div class="phone-wrapper">
  <div class="screen">

    <!-- HEADER -->
    <div class="receive-header">
      <button class="back-btn" id="back-btn">&#8592;</button>
      <span class="header-title" id="page-title">Receive USDT</span>
      <div class="header-spacer"></div>
    </div>

    <!-- BODY -->
    <div class="receive-body">

      <div class="qr-card">
        <div class="qr-inner">
          <!-- QR placeholder — swap for a real <img src="..."> or a QR generator -->
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="22" height="22" fill="#1c1c1e"/>
            <rect x="68" y="10" width="22" height="22" fill="#1c1c1e"/>
            <rect x="10" y="68" width="22" height="22" fill="#1c1c1e"/>
            <rect x="16" y="16" width="10" height="10" fill="#ffffff"/>
            <rect x="74" y="16" width="10" height="10" fill="#ffffff"/>
            <rect x="16" y="74" width="10" height="10" fill="#ffffff"/>
            <rect x="40" y="40" width="6" height="6" fill="#1c1c1e"/>
            <rect x="54" y="40" width="6" height="6" fill="#1c1c1e"/>
            <rect x="40" y="54" width="6" height="6" fill="#1c1c1e"/>
            <rect x="54" y="54" width="6" height="6" fill="#1c1c1e"/>
            <rect x="42" y="70" width="6" height="6" fill="#1c1c1e"/>
            <rect x="56" y="70" width="6" height="6" fill="#1c1c1e"/>
            <rect x="70" y="42" width="6" height="6" fill="#1c1c1e"/>
            <rect x="78" y="58" width="6" height="6" fill="#1c1c1e"/>
            <rect x="70" y="70" width="6" height="6" fill="#1c1c1e"/>
            <rect x="80" y="80" width="6" height="6" fill="#1c1c1e"/>
          </svg>
        </div>
      </div>

      <div class="address-pill" id="address-pill">0x9834fhksadhuiq230498uaksdw6wx71C694</div>

    </div>

    <!-- FOOTER -->
    <div class="receive-footer">
      <button class="close-btn" id="close-btn">Close</button>
    </div>

  </div>
</div>

<script>
  document.getElementById('back-btn').addEventListener('click', function () {
    window.location.href = 'receive.html';
  });

  document.getElementById('close-btn').addEventListener('click', function () {
    window.location.href = 'receive.html';
  });

  // Tap the address pill to copy it to clipboard
  document.getElementById('address-pill').addEventListener('click', function () {
    var text = this.textContent.trim();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {
        var el = document.getElementById('address-pill');
        var original = el.textContent;
        el.textContent = 'Copied!';
        setTimeout(function () { el.textContent = original; }, 1000);
      });
    }
  });
</script>

</html>
