<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1.0">
<title>Receive</title>
<style>
:root{
  --tw-blue:#002aff;
  --tw-text-dark:#000000;
  --tw-text-gray:#7e7e82;
  --tw-border:#eef0f3;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body{
  background-color:#0c0c0d;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.phone-wrapper{
  width:100%;
  max-width:412px;
  height:890px;
  background-color:#ffffff;
  border-radius:40px;
  box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  border:8px solid #1c1c1e;
}
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  background:#ffffff;
  padding-top:20px;
}

/* ---------- HEADER ---------- */
.receive-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px 10px;
  flex-shrink:0;
}
.back-btn{
  width:28px;
  height:28px;
  border-radius:50%;
  background:none;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--tw-text-dark);
  cursor:pointer;
}
.back-btn svg{
  width:16px;
  height:16px;
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
}
.header-title{
  font-size:16px;
  font-weight:700;
  color:var(--tw-text-dark);
  flex:1;
  text-align:center;
}
.header-spacer{
  width:28px;
}

/* ---------- SEARCH ---------- */
.search-container{
  padding:6px 20px 16px;
  flex-shrink:0;
}
.search-wrapper{
  position:relative;
  width:100%;
}
.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#b8b8bd;
  width:16px;
  height:16px;
  pointer-events:none;
}
.search-icon svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none;
}
.search-input{
  width:100%;
  padding:15px 16px 15px 44px;
  border:none;
  border-radius:14px;
  background:#f0f1f3;
  font-size:15px;
  color:var(--tw-text-dark);
  outline:none;
}
.search-input::placeholder{
  color:#b8b8bd;
  font-weight:400;
}

/* ---------- TOKEN LIST ---------- */
.token-list{
  flex:1;
  overflow-y:auto;
  padding:0 20px;
}
.token-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  cursor:pointer;
  border-bottom:1px solid #f4f4f7;
}
.token-row:last-child{
  border-bottom:none;
}
.token-row:hover{
  background:#fafafa;
  border-radius:12px;
}
.token-icon{
  width:40px;
  height:40px;
  border-radius:50%;
  flex-shrink:0;
  object-fit:contain;
  background:#ffffff;
}
.token-info{
  flex:1;
  min-width:0;
}
.token-symbol{
  font-size:15px;
  font-weight:700;
  color:var(--tw-text-dark);
  margin-bottom:2px;
  letter-spacing:-0.1px;
}
.token-address{
  font-size:12px;
  color:#8e8e93;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:-0.2px;
}
</style>
</head>
<body>
<div class="phone-wrapper">
  <div class="screen">

    <!-- HEADER -->
    <div class="receive-header">
      <button class="back-btn" id="back-btn" aria-label="Close">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
      <span class="header-title">Receive</span>
      <div class="header-spacer"></div>
    </div>

    <!-- SEARCH -->
    <div class="search-container">
      <div class="search-wrapper">
        <span class="search-icon">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        </span>
        <input type="text" class="search-input" id="search-input" placeholder="Search tokens">
      </div>
    </div>

    <!-- TOKEN LIST -->
    <div class="token-list">

      <div class="token-row" id="btc-row" data-symbol="BTC">
        <img class="token-icon" src="icons/btc2.svg" alt="BTC">
        <div class="token-info">
          <div class="token-symbol">BTC</div>
          <div class="token-address">bc1qcu...sdw6wx</div>
        </div>
      </div>

      <div class="token-row" id="eth-row" data-symbol="ETH">
        <img class="token-icon" src="icons/eth.svg" alt="ETH">
        <div class="token-info">
          <div class="token-symbol">ETH</div>
          <div class="token-address">0x71C6...234B29</div>
        </div>
      </div>

      <div class="token-row" id="usdt-row" data-symbol="USDT">
        <img class="token-icon" src="icons/usdt.webp" alt="USDT">
        <div class="token-info">
          <div class="token-symbol">USDT</div>
          <div class="token-address">0x9834...71C694</div>
        </div>
      </div>

      <div class="token-row" id="sol-row" data-symbol="SOL">
        <img class="token-icon" src="icons/sol.webp" alt="SOL">
        <div class="token-info">
          <div class="token-symbol">SOL</div>
          <div class="token-address">HN7cAB...uaGx41</div>
        </div>
      </div>

      <div class="token-row" id="bnb-row" data-symbol="BNB">
        <img class="token-icon" src="icons/bnb.webp" alt="BNB">
        <div class="token-info">
          <div class="token-symbol">BNB</div>
          <div class="token-address">0x4AC2...347547</div>
        </div>
      </div>

      <div class="token-row" id="xrp-row" data-symbol="XRP">
        <img class="token-icon" src="icons/xrp.svg" alt="XRP">
        <div class="token-info">
          <div class="token-symbol">XRP</div>
          <div class="token-address">rEb8k7...cuj8x9</div>
        </div>
      </div>

      <div class="token-row" id="ada-row" data-symbol="ADA">
        <img class="token-icon" src="icons/ada.webp" alt="ADA">
        <div class="token-info">
          <div class="token-symbol">ADA</div>
          <div class="token-address">addr1q...xx71c6</div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
  // Back button → returns to dashboard
  document.getElementById('back-btn').addEventListener('click', function () {
    window.location.href = 'Trustdashboard.html';
  });

  // Token rows → each goes to its own receive page
  var tokenRoutes = {
    'btc-row':  'bitcoin.html',
    'eth-row':  'ethereum.html',
    'usdt-row': 'usdt.html',
    'sol-row':  'sol.html',
    'bnb-row':  'bnb.html',
    'xrp-row':  'xrp.html',
    'ada-row':  'ada.html'
  };

  Object.keys(tokenRoutes).forEach(function (id) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener('click', function () {
        window.location.href = tokenRoutes[id];
      });
    }
  });

  // Live search filter
  document.getElementById('search-input').addEventListener('input', function () {
    var query = this.value.trim().toLowerCase();
    document.querySelectorAll('.token-row').forEach(function (row) {
      var symbol = (row.getAttribute('data-symbol') || '').toLowerCase();
      row.style.display = symbol.indexOf(query) !== -1 ? '' : 'none';
    });
  });
</script>

</body>
</html>
